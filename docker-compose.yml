services:
  postgres:
    image: postgres:15
    container_name: movie-postgres
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: movie-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/movies
      DB_USER: postgres
      DB_PASS: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://35.170.203.182:8080
    container_name: movie-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: